[platformio]
; env ที่ใช้เป็นค่าเริ่มต้น กด Build/Upload ใน VS Code จะได้เฟิร์มแวร์ตัวจริงเสมอ
; env "scan" เป็นโหมดวินิจฉัย ต้องเรียกด้วย -e scan เท่านั้น
default_envs = esp32dev

[common]
; pin เวอร์ชันไว้ ไม่งั้น platform 8.x (Arduino core 3.x / IDF5) จะทำให้ esp_task_wdt_init() คอมไพล์ไม่ผ่าน
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^6.21.3
    tzapu/WiFiManager @ ^2.0.16-rc.2
    knolleary/PubSubClient @ ^2.8
    4-20ma/ModbusMaster @ ^2.0.1

; เฟิร์มแวร์ปกติ
[env:esp32dev]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=1

; โหมดวินิจฉัยเซนเซอร์ RS485: pio run -e scan -t upload -t monitor
; ไล่หา baud rate และขา DE/RE ที่ถูกต้อง ไม่ต่อ WiFi ไม่ส่งข้อมูลขึ้นคลาวด์
[env:scan]
platform = ${common.platform}
board = ${common.board}
framework = ${common.framework}
monitor_speed = ${common.monitor_speed}
lib_deps = ${common.lib_deps}
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DMODBUS_SCAN_MODE
build_src_filter = +<*> -<main.cpp>
